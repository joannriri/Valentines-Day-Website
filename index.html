<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Valentine Mail 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    

    <div class="container">

        <!-- Closed Mail -->
        <div class="mail" id="mail">
            <img src="Asset/Mail-closed.png" class="mail-img">
            <img src="Asset/Wax.png" class="wax" id="wax">
            <p class="mail-text">Incoming Mail For You</p>
        </div>

        <!-- Open Letter -->
        <div class="letter" id="letter">
            <img src="Asset/mail-open.png" class="open-img">

            <div class="paper-wrapper">
                <div class="paper" id="paper">
                    <div class="paper-content">
                        <p id="valentineText"></p>
                    </div>
                </div>
                <button id="continueBtn" class="continue-btn">Continue</button>    
            </div>
            
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
